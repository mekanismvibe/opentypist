name: Release

# Push a tag like v0.2.0 to build, test and publish a release with a DMG.
# The Windows job then adds OpenTypist-<version>-win-x64.zip (+ .sha256) to
# the same release. Run it by hand (workflow_dispatch) to get the DMG and the
# zip as build artifacts only.
#
# Optional Developer ID signing and notarization: add these repository
# secrets and the app and DMG are signed and notarized automatically:
#   MACOS_CERTIFICATE           base64 of a Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  its password
#   MACOS_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)" >> "$GITHUB_OUTPUT"
          fi
          echo "rev=$(git rev-parse HEAD:vendor/llama.cpp)" >> "$GITHUB_OUTPUT"

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: build/llama-install
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.rev }}-${{ hashFiles('scripts/build-llama.sh') }}

      - name: Build tools
        run: |
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "CODESIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Self-test (no model)
        run: .build/release/OpenTypist --selftest-offline

      - name: Disk image
        run: ./scripts/make-dmg.sh

      - name: Notarize
        if: env.MACOS_CERTIFICATE != '' && env.APPLE_ID != ''
        run: |
          DMG="build/OpenTypist-${{ steps.version.outputs.version }}.dmg"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"
          (cd build && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: OpenTypist-${{ steps.version.outputs.version }}
          path: |
            build/OpenTypist-*.dmg
            build/OpenTypist-*.dmg.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -n "$MACOS_CERTIFICATE" ]; then
            OPEN_NOTE="Open the DMG and drag OpenTypist into Applications."
          else
            OPEN_NOTE="Open the DMG and drag OpenTypist into Applications. This build isn't signed with an Apple Developer ID, so the first time you open it macOS will refuse; go to System Settings → Privacy & Security, scroll down and click **Open Anyway** (or run \`xattr -dr com.apple.quarantine /Applications/OpenTypist.app\`). Updates installed from inside the app don't need this."
          fi
          cat > notes.md <<EOF
          ## Install

          $OPEN_NOTE

          Requires a Mac with Apple silicon and macOS 14 or later. On first launch a setup guide asks for the permissions OpenTypist needs and lets you pick a model to download.

          Already using OpenTypist? It updates itself: menu bar icon → Check for Updates….

          SHA-256: \`$(cut -d' ' -f1 "build/OpenTypist-$VERSION.dmg.sha256")\`
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "build/OpenTypist-$VERSION.dmg" "build/OpenTypist-$VERSION.dmg.sha256" \
            --title "OpenTypist $VERSION" --notes-file notes.md --generate-notes --verify-tag

  windows:
    # After the macOS job, which creates the release; this adds the Windows
    # build to it. The Mac asset names (.dmg, .dmg.sha256) stay as they are.
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      VULKAN_VERSION: 1.4.363.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          else { $version = [regex]::Match((Get-Content -Raw Resources\Info.plist), 'CFBundleShortVersionString</key>\s*<string>([^<]+)').Groups[1].Value }
          Add-Content -Encoding ascii $env:GITHUB_OUTPUT "version=$version"

      - name: Install Vulkan SDK
        run: |
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          curl.exe -fsSL -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          $process = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          if ($process.ExitCode) { exit $process.ExitCode }
          Add-Content -Encoding ascii $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content -Encoding ascii $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      - name: Build app (Vulkan + CPU)
        run: .\windows\build.ps1 -Version '${{ steps.version.outputs.version }}' -Package

      - name: Self-test (no model)
        run: |
          .\build\windows\OpenTypist\OpenTypist.exe --selftest-offline | Out-Host
          exit $LASTEXITCODE

      - name: Update test (checksum, unpack and swap the packaged zip)
        run: |
          $zip = 'build\windows\OpenTypist-${{ steps.version.outputs.version }}-win-x64.zip'
          .\build\windows\OpenTypist\OpenTypist.exe --update-test "$env:RUNNER_TEMP\update-test" --zip $zip | Out-Host
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        with:
          name: OpenTypist-${{ steps.version.outputs.version }}-win-x64
          path: |
            build/windows/OpenTypist-*-win-x64.zip
            build/windows/OpenTypist-*-win-x64.zip.sha256

      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = "build\windows\OpenTypist-$version-win-x64.zip"
          gh release upload $env:GITHUB_REF_NAME $zip "$zip.sha256" --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $hash = (Get-Content "$zip.sha256").Split(' ')[0]
          $body = (gh release view $env:GITHUB_REF_NAME --json body -q .body) -join "`n"
          $windows = @(
            '## Windows',
            '',
            "Download OpenTypist-$version-win-x64.zip, extract it to a folder you keep (don't run it from inside the zip) and open OpenTypist.exe. It lives in the notification area; pick a model to download when it asks.",
            '',
            'This build is not signed with a code-signing certificate yet, so the first time you open it Windows SmartScreen says "Windows protected your PC": click **More info**, then **Run anyway**. Updates installed from inside the app don''t need this.',
            '',
            'Requires 64-bit Windows 10 (1809) or later. Uses the graphics card through Vulkan when there is one, otherwise the CPU.',
            '',
            'Already using OpenTypist on Windows? It updates itself: tray icon, then Check for Updates....',
            '',
            "SHA-256: ``$hash``"
          ) -join "`n"
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.md", "$body`n`n$windows`n", (New-Object Text.UTF8Encoding $false))
          gh release edit $env:GITHUB_REF_NAME --notes-file "$env:RUNNER_TEMP\notes.md"
          exit $LASTEXITCODE
