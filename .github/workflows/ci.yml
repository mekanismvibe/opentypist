name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Pinned llama.cpp revision
        id: llama
        run: echo "rev=$(git rev-parse HEAD:vendor/llama.cpp)" >> "$GITHUB_OUTPUT"

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: build/llama-install
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ steps.llama.outputs.rev }}-${{ hashFiles('scripts/build-llama.sh') }}

      - name: Build tools
        run: |
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Self-test (no model)
        run: .build/release/OpenTypist --selftest-offline

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pinned llama.cpp revision
        id: llama
        run: Add-Content -Encoding ascii $env:GITHUB_OUTPUT "rev=$(git rev-parse HEAD:vendor/llama.cpp)"

      # Only the built DLLs are cached, not the CMake build tree, so a new
      # runner image (compiler) can't break it.
      - name: Cache native DLLs
        id: native
        uses: actions/cache@v4
        with:
          path: build/wn/runtime
          key: native-cpu-${{ runner.os }}-${{ steps.llama.outputs.rev }}-${{ hashFiles('windows/native/**') }}

      - name: Build app (CPU only)
        run: |
          if ('${{ steps.native.outputs.cache-hit }}' -eq 'true') { .\windows\build.ps1 -NoVulkan -SkipNative }
          else { .\windows\build.ps1 -NoVulkan }

      - name: Self-test (no model)
        run: |
          .\build\windows\OpenTypist\OpenTypist.exe --selftest-offline | Out-Host
          exit $LASTEXITCODE
